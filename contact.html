<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarittawat - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <iframe id="bg-video" src="https://www.youtube.com/embed/rTtMtX2B9ps?autoplay=1&mute=0&loop=1&playlist=rTtMtX2B9ps&controls=0&modestbranding=1" frameborder="0" allow="autoplay"></iframe>
    <div class="bg-overlay"></div>
    <div class="fire-border"></div>

    <header>
        <nav>
            <div class="logo">SARITTAWAT<span>.</span></div>
            <ul class="nav-links">
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="profile.html">ประวัติส่วนตัว</a></li>
                <li><a href="education.html">การศึกษา</a></li>
                <li><a href="hobby.html">งานอดิเรก</a></li>
                <li><a href="contact.html" class="active">ติดต่อ</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-section">
            <h2 class="section-title">สามารถติดต่อฉันได้ที่</h2>
            <div class="contact-grid">
                <div class="contact-card card interactive-card">
                    <div class="icon">📧</div>
                    <h3>อีเมล</h3>
                    <p>22834@chomthong.ac.th</p>
                </div>
                <div class="contact-card card interactive-card">
                    <div class="icon">📘</div>
                    <h3>Facebook</h3>
                    <p>ศริตวรรธน์ ยศเดชากิตติ์</p>
                </div>
                <div class="contact-card card interactive-card">
                    <div class="icon">📷</div>
                    <h3>Instagram</h3>
                    <p>@pang.za</p>
                </div>
                <div class="contact-card card interactive-card">
                    <div class="icon">💬</div>
                    <h3>Line ID</h3>
                    <p>ศริตวรรธน์</p>
                </div>
            </div>
            
            <div class="contact-cta">
                <a href="mailto:22834@chomthong.ac.th" class="btn primary-btn">ส่งอีเมลหาฉัน</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sarittawat Yotdechakit (M.3/2) - Chiang Mai, Thailand</p>
    </footer>

    <script>
        document.addEventListener('click', function(e) {
            let exp = document.createElement('div');
            exp.className = 'magma-explosion';
            exp.style.left = e.pageX + 'px'; exp.style.top = e.pageY + 'px';
            document.body.appendChild(exp);
            setTimeout(() => exp.remove(), 500);
        });
        document.querySelectorAll('.interactive-card').forEach(card => {
            card.addEventListener('click', function() {
                let phoenix = document.createElement('img');
                phoenix.src = 'https://i.gifer.com/origin/c6/c6f78df39be0329b1d03370e59a67451_w200.gif'; 
                phoenix.className = 'phoenix-fly';
                document.body.appendChild(phoenix);
                setTimeout(() => phoenix.remove(), 2500);
            });
        });
    </script>
</body>
</html>
