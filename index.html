<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarittawat - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Video Background -->
    <iframe id="bg-video" src="https://www.youtube.com/embed/rTtMtX2B9ps?autoplay=1&mute=0&loop=1&playlist=rTtMtX2B9ps&controls=0&modestbranding=1&showinfo=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <div class="bg-overlay"></div>
    <div class="fire-border"></div>

    <header>
        <nav>
            <div class="logo">SARITTAWAT<span>.</span></div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">หน้าแรก</a></li>
                <li><a href="profile.html">ประวัติส่วนตัว</a></li>
                <li><a href="education.html">การศึกษา</a></li>
                <li><a href="hobby.html">งานอดิเรก</a></li>
                <li><a href="contact.html">ติดต่อ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>สวัสดีครับ ผม <span>ปังปอนด์</span></h1>
                <h2>ศริตวรรธน์ ยศเดชากิตติ์</h2>
                <p>นักเรียน ม.3 ที่หลงใหลในเทคโนโลยีและการออกแบบ</p>
                <div class="quote-box card interactive-card">
                    "It's lapis"
                </div>
                <div class="hero-buttons">
                    <a href="profile.html" class="btn primary-btn">รู้จักฉันมากขึ้น</a>
                    <a href="hobby.html" class="btn secondary-btn">ดูงานอดิเรกของฉัน</a>
                </div>
            </div>
            <div class="hero-image">
                <div class="image-wrapper interactive-card card">
                    <img src="https://www.khaosod.co.th/wpapp/uploads/2019/06/62216820_2484852834909243_7694992050374049792_n.jpg" alt="รูปโปรไฟล์ของศริตวรรธน์">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sarittawat Yotdechakit (M.3/2) - All Rights Reserved.</p>
    </footer>

    <!-- Special Effects Script -->
    <script>
        // Magma Explosion on click
        document.addEventListener('click', function(e) {
            let explosion = document.createElement('div');
            explosion.className = 'magma-explosion';
            explosion.style.left = e.pageX + 'px';
            explosion.style.top = e.pageY + 'px';
            document.body.appendChild(explosion);
            setTimeout(() => explosion.remove(), 500);
        });

        // Phoenix on card click
        document.querySelectorAll('.interactive-card').forEach(card => {
            card.addEventListener('click', function() {
                let phoenix = document.createElement('img');
                // ใช้ GIF นกฟีนิกส์ไฟเป็นโมเดล
                phoenix.src = 'https://i.gifer.com/origin/c6/c6f78df39be0329b1d03370e59a67451_w200.gif'; 
                phoenix.className = 'phoenix-fly';
                document.body.appendChild(phoenix);
                setTimeout(() => phoenix.remove(), 2500);
            });
        });
    </script>
</body>
</html>
